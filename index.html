<!DOCTYPE html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <title>COMIC-BOX</title>
    <meta name="description" content="COMIC-BOX — 你的本地 AI 工作台" />
    <style>
      @keyframes jc-boot-in {
        from { opacity:0; transform:scale(0.7) }
        to   { opacity:1; transform:scale(1) }
      }
      #jc-boot-screen {
        position:fixed; top:0; left:0; width:100vw; height:100vh;
        background:#f8f5ec; z-index:2147483647;
        transition:opacity 0.35s ease-out;
      }
      #jc-boot-screen.jc-boot-fade-out { opacity:0; pointer-events:none }
      #jc-boot-center {
        position:absolute; left:50%; top:50%;
        transform:translate(-50%,-50%);
      }
    </style>
  </head>
  <body>
    <div id="jc-boot-screen">
      <div id="jc-boot-center">
        <div style="animation:jc-boot-in 0.8s cubic-bezier(0.22,0.61,0.36,1) both">
          <img src="/logo.svg" alt="COMIC-BOX" width="88" height="88" style="display:block" />
        </div>
      </div>
    </div>
    <div id="app"></div>
    <!-- 安全网：如果主模块加载失败，15s 后强制隐藏启动屏 -->
    <script src="/boot-guard.js"></script>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
